[project]
name = "hax-ai-canvas-hosted"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "flask==3.1.3",
  "vercel==0.12.0",
  "vercel-blob==0.5.0",
  "psycopg[binary]==3.3.6",
  "cryptography>=42.0.0",
  "beautifulsoup4>=4.11.0",
  "defusedxml==0.7.1",
  "pypdf>=3.17.0",
  "python-docx>=0.8.11",
  "python-pptx>=0.6.21",
  "anthropic==0.86.0",
  "openai==2.29.0",
  "google-genai==1.68.0",
  "httpx>=0.27.0,<1",
]

[tool.vercel]
entrypoint = "server:app"

[[tool.vercel.workflows]]
entrypoint = "workflows:wf"

[tool.uv]
package = false
